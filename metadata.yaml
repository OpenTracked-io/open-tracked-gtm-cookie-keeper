  - sha: ff38b556e34ff500a8c42ab5d6a82c8dffda974e
    changeNotes: First release. Keeps a visitor's tracking cookies (Meta _fbp and _fbc, Google _ga and FPID, TikTok _ttp ...) alive in browsers that delete them early, such as Safari with ITP. It remembers them in your Open Tracked Data Store under a hash of an identifier you choose, and gives them back when the same visitor returns without them.
